get:
  tags:
    - Tickets
  summary: Information about tickets
  description: Gets a list of tickets
  operationId: getTickets
  parameters:
    - $ref: '../parameters/projectId.yaml'
    - $ref: '../parameters/offset.yaml'
    - $ref: '../parameters/size.yaml'
  responses:
    200:
      description: Successfully returned the list of tickets
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Ticket.yaml'
        application/x-ndjson:
          schema:
            $ref: '../schemas/Ticket.yaml'

post:
  tags:
    - Tickets
  summary: Create a ticket
  description: Creates a new ticket.
  operationId: postTicket
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Ticket.yaml'
  responses:
    201:
      description: Successfully created a new ticket
      content:
        application/json:
          schema:
            $ref: '../schemas/Ticket.yaml'
