type: object
description: A property for asset type categories
required:
  - name
properties:
  name:
    type: string
    description: The unique name for this asset type category property
    example: longitude
  translation:
    nullable: true
    allOf:
      - $ref: 'Translation.yaml'
  unitId:
    type: integer
    description: ID of measurement unit
    example: 1231
    nullable: true