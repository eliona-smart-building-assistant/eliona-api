type: object
description: A site
required:
  - title
properties:
  id:
    type: string
    format: uuid
    description: The ID of the site
    example: 69133767-7de1-4134-9130-5f5403e1ee98
    nullable: true
  name:
    type: string
    description: The title of the site
    example: My Project
  location:
    type: object
    nullable: true
    description: The location of the site
    example: {
      "city": "Winterthur",
      "country": "CH",
      "street": "Harzachstrasse 5",
      "apartment": "1",
      "zip": "8404"
    }
